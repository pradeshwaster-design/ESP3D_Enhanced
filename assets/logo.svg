<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cubeGradTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cubeGradLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cubeGradRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="15" y="15" width="370" height="370" rx="90" fill="url(#logoBg)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#logoGlow)"/>

  <!-- Inner Circuit Grid Accent -->
  <g opacity="0.25">
    <circle cx="200" cy="200" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="200" cy="200" r="170" fill="none" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- 3D Isometric Cube / Printer Bed -->
  <g transform="translate(200, 175)">
    <!-- Top Face -->
    <polygon points="0,-75 75,-35 0,5 -75,-35" fill="url(#cubeGradTop)" stroke="#67e8f9" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-75,-35 0,5 0,90 -75,50" fill="url(#cubeGradLeft)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,5 75,-35 75,50 0,90" fill="url(#cubeGradRight)" stroke="#818cf8" stroke-width="2"/>
    
    <!-- Coordinate Axis / Extruder Nozzle Indicator -->
    <line x1="0" y1="-75" x2="0" y2="-105" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-105" r="5" fill="#f43f5e" filter="url(#logoGlow)"/>
  </g>

  <!-- Telegram Badge -->
  <g transform="translate(255, 230)">
    <circle cx="45" cy="45" r="45" fill="#229ED9" stroke="#0f172a" stroke-width="6" filter="url(#logoGlow)"/>
    <path d="M 28,45 L 62,30 L 56,60 L 44,51 L 39,57 L 37,48 Z" fill="#ffffff"/>
    <path d="M 44,51 L 56,36 L 37,48 Z" fill="#b0d8f0" opacity="0.6"/>
  </g>

  <!-- Bottom Label -->
  <text x="200" y="340" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="900" font-size="20" fill="#f8fafc" text-anchor="middle" letter-spacing="4">ESP3D ENHANCED</text>
</svg>
