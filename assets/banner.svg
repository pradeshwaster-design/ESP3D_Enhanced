<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a252f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097a7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bannerBg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternType="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2c3e50" stroke-width="1" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#grid)"/>
  
  <!-- Left: ESP chip icon -->
  <rect x="60" y="110" width="140" height="80" rx="10" fill="url(#accentGrad)" opacity="0.9"/>
  <rect x="70" y="120" width="120" height="60" rx="5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <circle cx="130" cy="150" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="170" cy="150" r="5" fill="#ffffff" opacity="0.8"/>
  
  <!-- Center: Text -->
  <text x="500" y="155" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">ESP3D-Ender3</text>
  <text x="500" y="205" font-family="Arial, sans-serif" font-size="18" fill="#00bcd4">Wireless connectivity for 3D printers</text>
  
  <!-- Right: Printer silhouette -->
  <path d="M 900 180 L 1000 180 L 1000 130 L 950 130 L 950 80 L 1050 80 L 1050 130 L 1100 130 L 1100 180 Z" fill="#37474f" stroke="#546e7a" stroke-width="2"/>
  <rect x="920" y="140" width="60" height="40" fill="#2c3e50" rx="4"/>
  <line x1="900" y1="210" x2="1100" y2="210" stroke="#546e7a" stroke-width="3"/>
  
  <!-- Connection line -->
  <path d="M 200 150 Q 500 150 500 150" stroke="#00bcd4" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M 500 150 Q 900 150 900 150" stroke="#00bcd4" stroke-width="2" opacity="0.5" fill="none"/>
  
  <!-- WiFi waves -->
  <path d="M 1050 130 Q 1100 130 1100 110" stroke="#00bcd4" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 1050 130 Q 1120 130 1120 90" stroke="#00bcd4" stroke-width="2" fill="none" opacity="0.4"/>
</svg>